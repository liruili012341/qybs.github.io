<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七一报社 - 官方网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            width: 90%;
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .logo {
            font-size: 36px;
            color: #1e90ff;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        h1 {
            color: #1e90ff;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .description {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        
        .website-info {
            background-color: #e6f2ff;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        
        .website-url {
            color: #1e90ff;
            font-weight: bold;
            font-size: 20px;
            word-break: break-all;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-primary {
            background-color: #1e90ff;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #4169e1;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: #333;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #555;
            transform: translateY(-2px);
        }
        
        .github-url {
            margin-top: 20px;
            font-size: 16px;
            color: #666;
        }
        
        .github-url a {
            color: #1e90ff;
            text-decoration: none;
        }
        
        .github-url a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .logo {
                font-size: 28px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .description {
                font-size: 16px;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">七一报社</div>
        <h1>官方网站已托管上线</h1>
        
        <p class="description">
            感谢您的关注！七一报社官方网站现已正式托管到PythonAnywhere平台，
            您可以通过以下地址访问我们的网站。
        </p>
        
        <div class="website-info">
            <p>网站托管地址：</p>
            <p class="website-url">https://liruili012341.pythonanywhere.com/</p>
        </div>
        
        <div class="buttons">
            <a href="https://liruili012341.pythonanywhere.com/" class="btn btn-primary">
                访问官方网站
            </a>
            <a href="https://github.com/liruili012341/qiyibaoshe" class="btn btn-secondary">
                查看开源代码
            </a>
        </div>
        
        <p class="github-url">
            开源项目地址：<a href="https://github.com/liruili012341/qiyibaoshe" target="_blank">
                https://github.com/liruili012341/qiyibaoshe
            </a>
        </p>
    </div>
</body>
</html>
